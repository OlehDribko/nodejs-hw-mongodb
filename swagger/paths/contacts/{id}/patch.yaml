tags:
  - Contacts
summary: Update contact by id
operationId: updateContact
description: 'Update contact by id'
security:
  - bearerAuth: []
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - contactType
        properties:
          name:
            description: 'Contact name'
            type: string
            example: 'John Doe'
          phoneNumber:
            description: 'Contacts phone number'
            type: number
            example: 0978558629
          contactType:
            description: 'Contact type'
            type: string
            example: 'work'
          photo:
            description: 'Link to contacts photo'
            type: string
            format: binary
          email:
            description: 'Contact email'
            type: string
            example: '22@gmailc.com'
          isFavourite:
            description: 'Contact is isFavourite'
            type: boolean
            example: false
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: '65ca67e7ae7f10c88b598384'
      description: 'Please provide only valid MongoDB id'
responses:
  '200':
    description: 'Update contact by id'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully patched a contact!
            data:
              type: object
              $ref: '../../../components/schemas/contact.yaml'
  '401':
    $ref: '../../../components/responses/401.yaml'
